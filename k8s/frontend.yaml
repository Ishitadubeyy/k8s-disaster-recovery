apiVersion: apps/v1
kind: Deployment
metadata:
  name: weatherwatch-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weatherwatch-frontend
  template:
    metadata:
      labels:
        app: weatherwatch-frontend
    spec:
      containers:
        - name: frontend
          image: weatherwatch-frontend:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: weatherwatch-frontend
spec:
  type: NodePort
  selector:
    app: weatherwatch-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
