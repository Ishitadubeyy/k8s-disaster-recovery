apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weatherwatch-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weatherwatch-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weatherwatch-postgres
  template:
    metadata:
      labels:
        app: weatherwatch-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: weatherwatch-config
                  key: PGDATABASE
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: weatherwatch-config
                  key: PGUSER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weatherwatch-db-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: database
              mountPath: /var/lib/postgresql/data
            - name: schema
              mountPath: /docker-entrypoint-initdb.d/001-schema.sql
              subPath: 001-schema.sql
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: weatherwatch-postgres-data
        - name: schema
          configMap:
            name: weatherwatch-db-schema
---
apiVersion: v1
kind: Service
metadata:
  name: weatherwatch-postgres
spec:
  selector:
    app: weatherwatch-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
