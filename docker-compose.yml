services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weatherwatch
      POSTGRES_USER: weatherwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting WeatherWatch}
    volumes:
      - weatherwatch-data:/var/lib/postgresql/data
      - ./app/backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weatherwatch -d weatherwatch"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  weatherwatch-backend:
    build:
      context: ./app/backend
    environment:
      PORT: 3001
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: weatherwatch
      PGUSER: weatherwatch
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting WeatherWatch}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./app/frontend
    ports:
      - "${WEATHERWATCH_PORT:-8080}:80"
    depends_on:
      weatherwatch-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  weatherwatch-data:
